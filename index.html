<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Temas</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <h1>Elige un tema</h1>

      <fieldset class="themes">
        <legend class="visually-hidden">Temas disponibles</legend>
        <label><input type="radio" name="theme" id="light" checked> Claro</label>
        <label><input type="radio" name="theme" id="dark"> Oscuro</label>
        <label><input type="radio" name="theme" id="blue"> Azul</label>
      </fieldset>

      <section class="card">
        <h2>Hola</h2>
        <p>Esta es una tarjeta de ejemplo con el tema seleccionado.</p>
        <button type="button">Ver más</button>
      </section>
    </main>
  </body>
</html>
